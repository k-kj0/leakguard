name: Leakguard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          ruff check .

      - name: Run research experiment
        run: python -m leakguard.experiment --n 30000 --horizon 50

      - name: Run order-flow-imbalance reproduction (synthetic, code check only)
        run: python -m leakguard.ofi_reproduction --n 30000 --out results

      - name: Display research report
        if: always()
        run: |
          if [ -f results/latest.md ]; then
            cat results/latest.md
            cat results/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Research report was not generated."
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-report
          path: results/
          if-no-files-found: ignore

name: Coinbase Real-Data Research Pipeline

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Coinbase product to capture"
        required: true
        default: "BTC-USD"
        type: string
      capture_seconds:
        description: "Capture duration in seconds (900 = 15 minutes)"
        required: true
        default: "900"
        type: string

permissions:
  contents: write

jobs:
  real-data-research:
    name: Capture, audit and evaluate real market data
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PRODUCT_ID: ${{ inputs.product_id }}
      CAPTURE_SECONDS: ${{ inputs.capture_seconds }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          python -m pytest -q

      - name: Capture Coinbase Advanced Trade Level 2 data
        run: |
          python -m leakguard.coinbase_ws \
            --product "$PRODUCT_ID" \
            --duration "$CAPTURE_SECONDS" \
            --out results/coinbase_ws_capture.csv

      - name: Normalize captured market data
        run: |
          python -m leakguard.coinbase_normalize \
            --input results/coinbase_ws_capture.csv \
            --out results/coinbase_normalized.csv

      - name: Audit normalized market data
        run: |
          python -m leakguard.data_quality \
            --input results/coinbase_normalized.csv \
            --out results/data_quality \
            --expected-interval-ms 100

      - name: Run research experiment on captured data
        run: |
          python -m leakguard.experiment \
            --data results/coinbase_normalized.csv \
            --horizon-ms 5000 \
            --splits 5 \
            --fee-bps 1 \
            --slippage-bps 1 \
            --out results/real_data_experiment

      - name: Reproduce the order-flow-imbalance result on captured data
        run: |
          python -m leakguard.ofi_reproduction \
            --data results/coinbase_normalized.csv \
            --out results

      - name: Run Red-Team challenge suite
        run: |
          python -m leakguard.redteam \
            --n 1200 \
            --seed 7 \
            --out results/redteam

      - name: Add pipeline summary
        if: always()
        run: |
          echo "# Coinbase Real-Data Research Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for report in \
            results/data_quality/latest.md \
            results/real_data_experiment/latest.md \
            results/ofi_reproduction.md \
            results/redteam/latest.md
          do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ -f results/coinbase_ws_capture.json ]; then
            echo "## Coinbase capture metadata" >> "$GITHUB_STEP_SUMMARY"
            cat results/coinbase_ws_capture.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the real-data reports to the repository
        run: |
          DEST="reports/real_capture_run_${{ github.run_number }}"
          mkdir -p "$DEST"
          cp results/real_data_experiment/latest.md "$DEST/experiment.md"
          cp results/real_data_experiment/latest.json "$DEST/experiment.json"
          cp results/ofi_reproduction.md "$DEST/ofi_reproduction.md"
          cp results/data_quality/latest.md "$DEST/data_quality.md"
          cp results/coinbase_ws_capture.json "$DEST/capture_metadata.json" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Add real-data report from run ${{ github.run_number }}"
          git push

      - name: Upload complete research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakguard-coinbase-research-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

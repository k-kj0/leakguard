name: Lint auto-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Apply safe automatic fixes
        run: ruff check --fix .

      - name: Show anything ruff could not fix
        run: ruff check . || true

      - name: Commit the fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply ruff auto-fixes"
            git push
          else
            echo "Nothing to fix."
          fi
